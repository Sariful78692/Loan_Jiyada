<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Loan Manager</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="app-container"><aside class="sidebar"><div class="brand"><h2>Loan Manager</h2></div><ul class="nav-menu"><li class="nav-item"><a href="Dashboard.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li><li class="nav-item"><a href="CustomerEntry.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Customer Entry</a></li><li class="nav-item"><a href="CustomerDetails.html" class="nav-link"><i class="fa-solid fa-users"></i> Customer Details</a></li><li class="nav-item"><a href="Report.html" class="nav-link"><i class="fa-solid fa-file-invoice"></i> Reports</a></li></ul></aside>
  <main class="main-content settings-main"><div class="settings-heading"><p class="eyebrow">ACCOUNT</p><h1>Settings</h1><p>Keep your sign-in details up to date.</p></div><div class="settings-grid"><section class="settings-card"><div class="settings-card-icon"><i class="fa-regular fa-user"></i></div><h2>Change username</h2><p>Your current username is <strong id="current-username"></strong>.</p><form id="change-username-form"><label for="new-username">New username</label><input id="new-username" required minlength="3" autocomplete="username"><label for="username-current-password">Current password</label><input id="username-current-password" type="password" required autocomplete="current-password"><p class="form-message" id="username-change-message"></p><button class="primary-button" type="submit">Save username</button></form></section><section class="settings-card"><div class="settings-card-icon"><i class="fa-solid fa-lock"></i></div><h2>Change password</h2><p>Use a password with at least 6 characters.</p><form id="change-password-form"><label for="current-password">Current password</label><input id="current-password" type="password" required autocomplete="current-password"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" required autocomplete="new-password"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="6" required autocomplete="new-password"><p class="form-message" id="password-change-message"></p><button class="primary-button" type="submit">Save password</button></form></section></div></main></div>
  <script src="js/common.js"></script><script src="js/sheet-auth.js"></script>
</body>
</html>
