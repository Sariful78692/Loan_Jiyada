<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Management - Login</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        
        <!-- Left Side: Login Form -->
        <div class="auth-form-container">
            <div class="auth-card">
                <div class="text-center">
                    <h2>LOAN MANAGEMENT</h2>
                    <p class="subtitle">Securely manage your financial workflows.</p>
                </div>
                
                <form id="login-form">
                    <!-- Username Input -->
                    <div class="input-wrap">
                        <label for="login-username">Username</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-user icon-left"></i>
                            <input id="login-username" type="text" placeholder="Enter your username" required>
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="input-wrap">
                        <label for="login-password">Password</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-lock icon-left"></i>
                            <input id="login-password" type="password" placeholder="Enter your password" required>
                            <i class="fa-solid fa-eye icon-right" id="togglePassword"></i>
                        </div>
                    </div>
                    
                    <!-- Remember Me Checkbox -->
                    <div class="remember-row">
                        <label class="remember-option">
                            <input type="checkbox"> Remember me
                        </label>
                    </div>
                    
                    <!-- Forgot Links -->
                    <div class="forgot-links-row">
                        <button type="button" class="link-btn" onclick="forgotUsername()">Forgot Username?</button>
                        <button type="button" class="link-btn" onclick="forgotPassword()">Forgot Password?</button>
                    </div>
                    
                    <button type="submit" class="primary-button">Sign In</button>
                    <p id="login-message" class="form-message"></p>
                </form>
            </div>
        </div>

        <!-- Right Side: Intro (Desktop only) -->
        <div class="auth-intro">
            <div class="intro-content">
                <h1>Secure Loan System</h1>
                <p>Manage your customers, track daily collections, and generate financial reports efficiently in one secure platform.</p>
            </div>
        </div>

    </main>

    <!-- Script for Eye Icon Toggle -->
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordField = document.getElementById('login-password');
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
    <script src="js/login.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
