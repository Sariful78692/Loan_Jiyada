<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports - Loan Manager</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .export-btns { margin-bottom: 15px; display: flex; gap: 10px; }
    .export-btns button { padding: 10px 15px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
    .btn-excel { background-color: #16a34a; }
    .btn-print { background-color: #2563eb; }
    
    /* Edit Modal CSS */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7); 
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none !important; }
    .modal-content {
      background: white; padding: 30px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
      width: 90%; max-width: 400px;
      text-align: center;
    }

    @media print { .sidebar, .export-btns, th:last-child, td:last-child { display: none !important; } .main-content { padding: 0; } }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Loan Manager</h2>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="Dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        
        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-users"></i> Customer Information <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <ul class="submenu">
            <li><a href="CustomerEntry.html">Customer Entry</a></li>
            <li><a href="CustomerDetails.html">Customer Details</a></li>
          </ul>
        </li>

        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-hand-holding-dollar"></i> Loan Type <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <ul class="submenu" id="sidebar-loan-list">
            <li><a href="CustomerDetails.html?loan=RD Loan">RD Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Group Loan">Group Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Gold Loan">Gold Loan</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a href="Report.html" class="nav-link" style="color: #fff;">
            <i class="fa-solid fa-file-invoice"></i> Reports
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="content-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
          <h1 id="report-heading" style="margin: 0;">Collections Report</h1>
          
          <!-- লোন টাইপ অনুযায়ী ফিল্টার করার ড্রপডাউন -->
          <!-- লোন টাইপ অনুযায়ী ফিল্টার ড্রপডাউন (ডায়নামিক) -->
          <div>
            <select id="reportFilter" onchange="changeReportType()" style="padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; outline: none; background: white; color: #1e293b; cursor: pointer;">
              <option value="collections">Collections Report</option>
              <option value="All">All Customers Report</option>
              <!-- JS দিয়ে সাইডবার থেকে লোন টাইপগুলো এখানে অটোমেটিক চলে আসবে -->
            </select>
          </div>
        </div>

        <div class="export-btns">
          <button class="btn-excel" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
          <button class="btn-print" onclick="printReport()"><i class="fa-solid fa-print"></i> Print</button>
        </div>

        <div class="table-responsive">
          <table id="report-table" style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr id="table-header-row" style="background-color: #f8fafc; color: #0284c7; text-align: left; font-size: 13px;">
                <!-- JS দিয়ে ডাইনামিক হেডার ও ডেটা লোড হবে -->
              </tr>
            </thead>
            <tbody id="report-table-body">
              <tr><td colspan="6" class="text-center" style="padding: 20px;">Loading Report...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Edit Collection Modal -->
  <div id="edit-collection-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="color: #0284c7; margin-bottom: 15px;"><i class="fa-solid fa-pen-to-square"></i> Edit Collection</h3>
      <input type="hidden" id="edit-coll-id">
      
      <div style="margin-bottom: 15px; text-align: left;">
        <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">Collection Date</label>
        <input type="date" id="edit-coll-date" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
      </div>

      <div style="margin-bottom: 20px; text-align: left;">
        <label style="font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 5px;">Amount</label>
        <input type="number" id="edit-coll-amount" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none;">
      </div>

      <div style="display: flex; gap: 10px; justify-content: center;">
        <button onclick="updateCollection()" style="background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Update</button>
        <button onclick="closeEditModal()" style="background: #ef4444; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
