<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Entry - Loan Management</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Loan Management</h2>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="Dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        
        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-users"></i> Customer Information <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <ul class="submenu">
            <li><a href="CustomerEntry.html">Customer Entry</a></li>
            <li><a href="CustomerDetails.html">Customer Details</a></li>
          </ul>
        </li>

        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-hand-holding-dollar"></i> Loan Type <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <ul class="submenu" id="sidebar-loan-list">
            <li><a href="CustomerDetails.html?loan=RD Loan">RD Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Group Loan">Group Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Gold Loan">Gold Loan</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a href="Report.html" class="nav-link">
            <i class="fa-solid fa-file-invoice"></i> Reports
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <section id="customer-entry-section" class="content-section">
        <h1 id="form-title">Customer Entry Form</h1>
        <form id="customer-form">
          <input type="hidden" id="edit-customer-id" value="">
          <input type="hidden" id="existing-photo-url" value="">

          <!-- Personal Details -->
          <div class="form-card">
            <h3>Personal Details</h3>
            <div class="form-grid">
              
              <div class="form-group"><label>Customer Name *</label><input type="text" id="customerName" required></div>
              <div class="form-group">
                <label>Guardian Type *</label>
                <select id="guardianType" required>
                  <option value="">Select Relation</option>
                  <option value="Father's Name">Father's Name</option>
                  <option value="Mother's Name">Mother's Name</option>
                  <option value="Husband's Name">Husband's Name</option>
                </select>
              </div>
              <div class="form-group"><label>Guardian Name *</label><input type="text" id="guardianName" required></div>
              <div class="form-group">
                <label>Gender *</label>
                <select id="gender" required>
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group"><label>DOB *</label><input type="date" id="dob" required></div>
              
              <!-- 🟢 Religion Dropdown -->
              <div class="form-group">
                <label>Religion</label>
                <select id="religion">
                  <option value="">Select Religion</option>
                  <option value="Muslim">Muslim</option>
                  <option value="Hinduism">Hinduism</option>
                </select>
              </div>
              
              <!-- 🟢 Aadhaar No Validation (12 digits only) -->
              <div class="form-group">
                <label>Aadhaar No *</label>
                <input type="text" id="aadhaarNo" maxlength="12" pattern="\d{12}" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="12-digit number" required>
              </div>
              
              <!-- 🟢 Mobile No Validation (10 digits only) -->
              <div class="form-group">
                <label>Mobile No *</label>
                <input type="text" id="mobileNo" maxlength="10" pattern="\d{10}" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="10-digit number" required>
              </div>
              
              <div class="form-group"><label>Address *</label><input type="text" id="address" placeholder="Enter Full Address" required></div>

              <!-- 🟢 Photo Upload with 1 MB validation -->
              <div class="form-group">
                <label>Photo (Max 1 MB)</label>
                <input type="file" id="photoInput" accept="image/*" onchange="validatePhotoSize(this)">
                <small id="photo-error" style="color: #ef4444; font-size: 12px; font-weight: bold; display: none; margin-top: 5px;">File size must be less than 1 MB!</small>
                <div class="preview-box">
                  <img id="photoPreview" src="" alt="Photo Preview" class="hidden-preview">
                </div>
              </div>

              <div class="form-group">
                <label>Occupation *</label>
                <div class="select-with-btn">
                  <select id="occupationSelect" required>
                    <option value="">Select Occupation</option>
                    <option value="Labour">Labour</option>
                    <option value="Service">Service</option>
                    <option value="Self Employed">Self Employed</option>
                    <option value="Hand Embrodary">Hand Embrodary</option>
                  </select>
                  <button type="button" class="btn-small bg-blue" onclick="promptAddNewOccupation()" title="Add Occupation">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                  <button type="button" class="btn-small bg-yellow" onclick="promptEditSelectedOption('occupationSelect', 'Occupation')" title="Edit selected occupation"><i class="fa-solid fa-pen"></i></button>
                  <button type="button" class="btn-small bg-red" onclick="deleteSelectedOption('occupationSelect', 'Occupation')" title="Delete selected occupation"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>

              <div class="form-group">
                <label>Bank Details</label>
                <div class="select-with-btn">
                  <select id="bankName">
                    <option value="">Select Bank</option>
                    <option value="State Bank of India">State Bank of India</option>
                    <option value="HDFC Bank">HDFC Bank</option>
                    <option value="ICICI Bank">ICICI Bank</option>
                    <option value="Axis Bank">Axis Bank</option>
                    <option value="Punjab National Bank">Punjab National Bank</option>
                  </select>
                  <button type="button" class="btn-small bg-blue" onclick="promptAddNewBank()" title="Add Bank">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                  <button type="button" class="btn-small bg-yellow" onclick="promptEditSelectedBank()" title="Edit selected bank">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button type="button" class="btn-small bg-red" onclick="deleteSelectedBank()" title="Delete selected bank">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>
              <div id="bank-detail-fields" style="display: contents;">
                <div class="form-group"><label>Branch</label><input type="text" id="bankBranch" placeholder="Enter branch name"></div>
                <div class="form-group"><label>IFSC Code</label><input type="text" id="ifscCode" maxlength="11" placeholder="e.g. SBIN0001234" style="text-transform: uppercase;"></div>
                <div class="form-group"><label>Account Holder's Name</label><input type="text" id="accountHolderName" placeholder="Enter account holder's name"></div>
                <div class="form-group"><label>Account Number</label><input type="text" id="accountNumber" inputmode="numeric" placeholder="Enter account number"></div>
              </div>

              <div class="form-group">
                <label>Loan Type *</label>
                <div class="select-with-btn">
                  <select id="loanTypeSelect" required>
                    <option value="">Select Loan Type</option>
                    <option value="RD Loan">RD Loan</option>
                    <option value="Group Loan">Group Loan</option>
                    <option value="Gold Loan">Gold Loan</option>
                  </select>
                  <button type="button" class="btn-small bg-blue" onclick="promptAddNewLoanType()" title="Add Loan Type">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                  <button type="button" class="btn-small bg-yellow" onclick="promptEditSelectedOption('loanTypeSelect', 'Loan Type')" title="Edit selected loan type"><i class="fa-solid fa-pen"></i></button>
                  <button type="button" class="btn-small bg-red" onclick="deleteSelectedOption('loanTypeSelect', 'Loan Type')" title="Delete selected loan type"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>

            </div>
          </div>

          <!-- RD Loan Details -->
          <div class="form-card hidden" id="rd-loan-details" style="border: 1px solid #38bdf8; background-color: #f0fdfa;">
            <h3 style="color: #0369a1;"><i class="fa-solid fa-hand-holding-dollar"></i> RD Loan Details</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>RD Amount *</label>
                <input type="number" id="loanAmount" placeholder="Enter Amount">
              </div>
              <div class="form-group">
                <label>Start Date *</label>
                <input type="date" id="startDate">
              </div>
              <div class="form-group">
                <label>Duration (Days) *</label>
                <input type="number" id="durationDays" placeholder="e.g. 365">
              </div>
              <div class="form-group">
                <label>Interest % *</label>
                <input type="number" step="any" id="interestRate" placeholder="Enter Interest %">
              </div>
            </div>
          </div>

          <!-- Nominee Details -->
          <div class="form-card">
            <h3>Nominee Details</h3>
            <div class="form-grid">
              <div class="form-group"><label>Nominee Name *</label><input type="text" id="nomineeName" required></div>
              <div class="form-group">
                <label>Nominee Guardian Type</label>
                <select id="nomineeGuardianType">
                  <option value="">Select Relation</option>
                  <option value="Father's Name">Father's Name</option>
                  <option value="Mother's Name">Mother's Name</option>
                  <option value="Husband's Name">Husband's Name</option>
                </select>
              </div>
              <div class="form-group"><label>Nominee Guardian Name</label><input type="text" id="nomineeGuardianName"></div>
              <div class="form-group">
                <label>Nominee Gender</label>
                <select id="nomineeGender">
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              
              <div class="form-group">
                <label>Nominee Occupation</label>
                <div class="select-with-btn">
                  <select id="nomineeOccupationSelect">
                    <option value="">Select Occupation</option>
                    <option value="Housewife">Housewife</option>
                    <option value="Labour">Labour</option>
                    <option value="Service">Service</option>
                    <option value="Self Employed">Self Employed</option>
                  </select>
                  <button type="button" class="btn-small bg-blue" onclick="promptAddNewNomineeOccupation()" title="Add Nominee Occupation">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                  <button type="button" class="btn-small bg-yellow" onclick="promptEditSelectedOption('nomineeOccupationSelect', 'Nominee Occupation')" title="Edit selected nominee occupation"><i class="fa-solid fa-pen"></i></button>
                  <button type="button" class="btn-small bg-red" onclick="deleteSelectedOption('nomineeOccupationSelect', 'Nominee Occupation')" title="Delete selected nominee occupation"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>

              <div class="form-group"><label>Nominee DOB</label><input type="date" id="nomineeDob"></div>
              
              <!-- 🟢 Nominee Aadhaar Validation (12 digits only) -->
              <div class="form-group">
                <label>Nominee Aadhaar</label>
                <input type="text" id="nomineeAadhaar" maxlength="12" pattern="\d{12}" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="12-digit number">
              </div>
              
              <!-- 🟢 Relation with Applicant Dropdown with Plus Icon -->
              <div class="form-group">
                <label>Relation with Applicant *</label>
                <div class="select-with-btn">
                  <select id="relationWithApplicant" required>
                    <option value="">Select Relation</option>
                    <option value="Father's">Father's</option>
                    <option value="Husband's">Husband's</option>
                    <option value="Wife">Wife</option>
                    <option value="Daughter">Daughter</option>
                    <option value="Son">Son</option>
                  </select>
                  <button type="button" class="btn-small bg-blue" onclick="promptAddNewRelation()" title="Add Custom Relation">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                  <button type="button" class="btn-small bg-yellow" onclick="promptEditSelectedOption('relationWithApplicant', 'Relation')" title="Edit selected relation"><i class="fa-solid fa-pen"></i></button>
                  <button type="button" class="btn-small bg-red" onclick="deleteSelectedOption('relationWithApplicant', 'Relation')" title="Delete selected relation"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>

            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn-primary">Save Customer</button>
            <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  

  <script src="js/common.js"></script>
  <script src="js/customer_entry.js"></script>
</body>
</html>
