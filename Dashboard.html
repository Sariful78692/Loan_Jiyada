<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Loan Manager</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Loan Manager</h2>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="Dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        
        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-users"></i> Customer Information <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <ul class="submenu">
            <li><a href="CustomerEntry.html">Customer Entry</a></li>
            <li><a href="CustomerDetails.html">Customer Details</a></li>
          </ul>
        </li>

        <li class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle">
            <i class="fa-solid fa-hand-holding-dollar"></i> Loan Type <i class="fa-solid fa-chevron-down arrow"></i>
          </a>
          <!-- id="sidebar-loan-list" দেওয়া হয়েছে যাতে JS দিয়ে নতুন লোন এখানে ঢোকানো যায় -->
          <ul class="submenu" id="sidebar-loan-list">
            <li><a href="CustomerDetails.html?loan=RD Loan">RD Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Group Loan">Group Loan</a></li>
            <li><a href="CustomerDetails.html?loan=Gold Loan">Gold Loan</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a href="Report.html" class="nav-link">
            <i class="fa-solid fa-file-invoice"></i> Reports
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="content-section">
        <h1>Dashboard</h1>
        <div class="dashboard-cards">
          <!-- Total Active -->
          <div class="stat-card border-blue">
            <div class="stat-icon bg-blue-light text-blue"><i class="fa-solid fa-users"></i></div>
            <div class="stat-info"><span class="stat-title">Total Active</span><h3 class="stat-value" id="count-total">0</h3></div>
          </div>
          <!-- RD Loan -->
          <div class="stat-card border-yellow">
            <div class="stat-icon bg-yellow-light text-yellow"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <div class="stat-info"><span class="stat-title">RD Loan</span><h3 class="stat-value" id="count-rd">0</h3></div>
          </div>
          <!-- Group Loan -->
          <div class="stat-card border-green">
            <div class="stat-icon bg-green-light text-green"><i class="fa-solid fa-users-rectangle"></i></div>
            <div class="stat-info"><span class="stat-title">Group Loan</span><h3 class="stat-value" id="count-group-loan">0</h3></div>
          </div>
          <!-- Gold Loan -->
          <div class="stat-card border-red">
            <div class="stat-icon bg-red-light text-red"><i class="fa-solid fa-coins"></i></div>
            <div class="stat-info"><span class="stat-title">Gold Loan</span><h3 class="stat-value" id="count-gold">0</h3></div>
          </div>
        </div>

        <div class="charts-container">
          <div class="chart-card"><h3>Loan Type Overview</h3><canvas id="loanTypeChart"></canvas></div>
          <div class="chart-card"><h3>Group Wise Customers</h3><canvas id="groupNameChart"></canvas></div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
